<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Scale Identification Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    .question {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      font-size: 16px;
    }
    input[type="text"] {
      font-size: 16px;
      padding: 5px;
      width: 100px;
    }
    #score {
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
      text-align: center;
    }
    #feedback {
      margin-top: 10px;
      font-weight: bold;
    }
    canvas {
      border: 1px solid #ccc;
      margin-top: 15px;
      background: white;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Graph Scale Identification Quiz</h1>
  <div id="quiz-container"></div>
  <button id="next-btn" style="display:none;">Next Question</button>
  <div id="score"></div>

  <script>
    const scales = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 0.1, 0.2, 0.25, 0.5];

    function formatScale(scale) {
      if (scale < 1) {
        return scale.toFixed(2).replace(/\.?0+$/, '');
      }
      return scale.toString();
    }

    // Draw Cartesian grid on canvas
    // Parameters:
    // canvas: canvas element
    // xScale, yScale: scale per interval
    // quadrants: 1 or 4
    function drawGrid(canvas, xScale, yScale, quadrants) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      // Grid settings
      const margin = 40; // margin for labels
      const gridWidth = width - 2 * margin;
      const gridHeight = height - 2 * margin;

      // Number of intervals on each axis
      // For quadrant 1: 10 intervals from 0 to 10 * scale
      // For 4 quadrants: 5 intervals each side (negative and positive)
      const intervalsX = quadrants === 1 ? 10 : 5;
      const intervalsY = quadrants === 1 ? 10 : 5;

      // Calculate pixels per interval
      const pxPerIntervalX = gridWidth / (intervalsX * (quadrants === 4 ? 2 : 1));
      const pxPerIntervalY = gridHeight / (intervalsY * (quadrants === 4 ? 2 : 1));

      // Origin coordinates in canvas pixels
      const originX = quadrants === 1 ? margin : margin + intervalsX * pxPerIntervalX;
      const originY = quadrants === 1 ? height - margin : margin + intervalsY * pxPerIntervalY;

      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;

      // Draw vertical grid lines
      for (let i = 0; i <= intervalsX * (quadrants === 4 ? 2 : 1); i++) {
        const x = margin + i * pxPerIntervalX;
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, height - margin);
        ctx.stroke();
      }

      // Draw horizontal grid lines
      for (let i = 0; i <= intervalsY * (quadrants === 4 ? 2 : 1); i++) {
        const y = margin + i * pxPerIntervalY;
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(width - margin, y);
        ctx.stroke();
      }

      // Draw axes
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 2;

      // x-axis
      ctx.beginPath();
      ctx.moveTo(margin, originY);
      ctx.lineTo(width - margin, originY);
      ctx.stroke();

      // y-axis
      ctx.beginPath();
      ctx.moveTo(originX, margin);
      ctx.lineTo(originX, height - margin);
      ctx.stroke();

      ctx.fillStyle = 'black';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      // Draw x-axis tick marks and labels
      for (let i = 0; i <= intervalsX * (quadrants === 4 ? 2 : 1); i++) {
        const x = margin + i * pxPerIntervalX;
        const tickHeight = 6;
        ctx.beginPath();
        ctx.moveTo(x, originY - tickHeight / 2);
        ctx.lineTo(x, originY + tickHeight / 2);
        ctx.stroke();

        // Calculate label value
        let labelValue;
        if (quadrants === 1) {
          labelValue = formatScale(xScale * i);
        } else {
          labelValue = formatScale(xScale * (i - intervalsX));
        }
        ctx.fillText(labelValue, x, originY + tickHeight + 2);
      }

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      // Draw y-axis tick marks and labels
      for (let i = 0; i <= intervalsY * (quadrants === 4 ? 2 : 1); i++) {
        const y = margin + i * pxPerIntervalY;
        const tickWidth = 6;
        ctx.beginPath();
        ctx.moveTo(originX - tickWidth / 2, y);
        ctx.lineTo(originX + tickWidth / 2, y);
        ctx.stroke();

        // Calculate label value (y-axis labels go from top to bottom)
        let labelValue;
        if (quadrants === 1) {
          labelValue = formatScale(yScale * (intervalsY - i));
        } else {
          labelValue = formatScale(yScale * (intervalsY - i));
        }
        ctx.fillText(labelValue, originX - tickWidth - 4, y);
      }
    }

    function generateScaleQuestion(quadrants) {
      const xScale = scales[Math.floor(Math.random() * scales.length)];
      const yScale = scales[Math.floor(Math.random() * scales.length)];

      let xRange, yRange, quadrantDesc;
      if (quadrants === 1) {
        xRange = `0 to ${formatScale(xScale * 10)}`;
        yRange = `0 to ${formatScale(yScale * 10)}`;
        quadrantDesc = "Quadrant 1 only (positive x and y)";
      } else {
        xRange = `${formatScale(-xScale * 5)} to ${formatScale(xScale * 5)}`;
        yRange = `${formatScale(-yScale * 5)} to ${formatScale(yScale * 5)}`;
        quadrantDesc = "All four quadrants (negative and positive x and y)";
      }

      return {
        type: "scale-identify",
        questionText: `Identify the scale on the x-axis and y-axis for the following Cartesian coordinate grid:<br>
        - ${quadrantDesc}<br>
        - x-axis range: ${xRange}<br>
        - y-axis range: ${yRange}<br>
        (Hint: The grid lines are evenly spaced according to the scale.)`,
        xScale,
        yScale,
        quadrants
      };
    }

    function generateAxisValuesQuestion() {
      const xScale = scales[Math.floor(Math.random() * scales.length)];
      const yScale = scales[Math.floor(Math.random() * scales.length)];
      const intervals = 5;

      return {
        type: "axis-values",
        questionText: `Write the values on the axes below given the following scales:<br>
        - The interval for the x-axis is ${formatScale(xScale)}<br>
        - The interval for the y-axis is ${formatScale(yScale)}<br>
        - There are ${intervals} intervals on each axis, starting at 0.<br>
        Question: List the values on the x-axis and y-axis at each interval.`,
        xValues: Array.from({length: intervals + 1}, (_, i) => +(xScale * i).toFixed(5)),
        yValues: Array.from({length: intervals + 1}, (_, i) => +(yScale * i).toFixed(5))
      };
    }

    const questions = [];

    for (let i = 0; i < 2; i++) {
      questions.push(generateScaleQuestion(1));
    }
    for (let i = 0; i < 3; i++) {
      questions.push(generateScaleQuestion(4));
    }
    for (let i = 0; i < 2; i++) {
      questions.push(generateAxisValuesQuestion());
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
    shuffle(questions);

    let currentQuestionIndex = 0;
    let score = 0;

    const quizContainer = document.getElementById("quiz-container");
    const nextBtn = document.getElementById("next-btn");
    const scoreDiv = document.getElementById("score");

    function showQuestion() {
      nextBtn.style.display = "none";
      const q = questions[currentQuestionIndex];
      quizContainer.innerHTML = `<div class="question">
        <p><strong>Question ${currentQuestionIndex + 1} of ${questions.length}:</strong></p>
        <p>${q.questionText}</p>
        <div id="graph-container"></div>
        <div id="answer-area"></div>
        <div id="feedback"></div>
      </div>`;

      const answerArea = document.getElementById("answer-area");
      const feedback = document.getElementById("feedback");
      const graphContainer = document.getElementById("graph-container");

      if (q.type === "scale-identify") {
        // Create canvas for graph
        const canvas = document.createElement("canvas");
        canvas.width = 500;
        canvas.height = 500;
        graphContainer.appendChild(canvas);

        drawGrid(canvas, q.xScale, q.yScale, q.quadrants);

        answerArea.innerHTML = `
          <label for="x-scale-input">Scale on x-axis: </label>
          <input type="text" id="x-scale-input" autocomplete="off" />
          <br />
          <label for="y-scale-input">Scale on y-axis: </label>
          <input type="text" id="y-scale-input" autocomplete="off" />
          <br />
          <button id="submit-btn">Submit</button>
        `;

        document.getElementById("submit-btn").onclick = () => {
          const xInput = document.getElementById("x-scale-input").value.trim();
          const yInput = document.getElementById("y-scale-input").value.trim();
          if (xInput === "" || yInput === "") {
            feedback.textContent = "Please enter both scales.";
            return;
          }
          if (xInput === formatScale(q.xScale) && yInput === formatScale(q.yScale)) {
            feedback.textContent = "Correct!";
            score++;
          } else {
            feedback.innerHTML = `Incorrect. The correct scales are x-axis: <strong>${formatScale(q.xScale)}</strong>, y-axis: <strong>${formatScale(q.yScale)}</strong>.`;
          }
          nextBtn.style.display = "inline-block";
          disableInputs();
          updateScore();
        };
      } else if (q.type === "axis-values") {
        answerArea.innerHTML = `
          <label for="x-values-input">x-axis values (comma separated): </label><br />
          <input type="text" id="x-values-input" autocomplete="off" style="width: 100%;" />
          <br />
          <label for="y-values-input">y-axis values (comma separated): </label><br />
          <input type="text" id="y-values-input" autocomplete="off" style="width: 100%;" />
          <br />
          <button id="submit-btn">Submit</button>
        `;

        document.getElementById("submit-btn").onclick = () => {
          const xInput = document.getElementById("x-values-input").value.trim();
          const yInput = document.getElementById("y-values-input").value.trim();
          if (xInput === "" || yInput === "") {
            feedback.textContent = "Please enter values for both axes.";
            return;
          }
          const xUserValues = xInput.split(",").map(s => s.trim());
          const yUserValues = yInput.split(",").map(s => s.trim());

          const xCorrect = q.xValues.map(v => formatScale(v));
          const yCorrect = q.yValues.map(v => formatScale(v));

          if (arraysEqual(xUserValues, xCorrect) && arraysEqual(yUserValues, yCorrect)) {
            feedback.textContent = "Correct!";
            score++;
          } else {
            feedback.innerHTML = `Incorrect.<br>Correct x-axis values: <strong>${xCorrect.join(", ")}</strong><br>Correct y-axis values: <strong>${yCorrect.join(", ")}</strong>`;
          }
          nextBtn.style.display = "inline-block";
          disableInputs();
          updateScore();
        };
      }
    }

    function disableInputs() {
      const inputs = quizContainer.querySelectorAll("input, button");
      inputs.forEach(el => {
        if (el.id !== "next-btn") el.disabled = true;
      });
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    nextBtn.onclick = () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        quizContainer.innerHTML = `<h2>Quiz complete!</h2><p>Your score: ${score} / ${questions.length}</p>`;
        nextBtn.style.display = 'none';
      }
    };

    function updateScore() {
      scoreDiv.textContent = `Score: ${score} / ${questions.length}`;
    }

    showQuestion();
    updateScore();
  </script>
</body>
</html>
