<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Scale Identification Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    .question {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
      position: relative;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      font-size: 16px;
    }
    input[type="text"] {
      font-size: 16px;
      padding: 5px;
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }
    #score {
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
      text-align: center;
    }
    #feedback {
      margin-top: 10px;
      font-weight: bold;
    }
    canvas {
      border: 1px solid #ccc;
      margin-top: 15px;
      background: white;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    /* Container for inputs on graph */
    .input-container {
      position: relative;
      width: 500px;
      height: 500px;
      margin: 0 auto;
    }
    .axis-input {
      position: absolute;
      width: 40px;
      font-size: 14px;
      padding: 2px 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Graph Scale Identification Quiz</h1>
  <div id="quiz-container"></div>
  <button id="next-btn" style="display:none;">Next Question</button>
  <div id="score"></div>

  <script>
    const scales = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 0.1, 0.2, 0.25, 0.5];

    function formatScale(scale) {
      if (scale < 1) {
        return scale.toFixed(2).replace(/\.?0+$/, '');
      }
      return scale.toString();
    }

    // Helper: generate random subset of tick indices to label (excluding first tick)
    // totalTicks: total number of ticks on axis
    // minLabels, maxLabels: range of how many ticks to label (excluding first blank)
    function randomTickLabels(totalTicks, minLabels, maxLabels) {
      const count = Math.floor(Math.random() * (maxLabels - minLabels + 1)) + minLabels;
      const possibleTicks = [];
      for (let i = 1; i < totalTicks; i++) {
        possibleTicks.push(i);
      }
      // Shuffle and pick count ticks
      for (let i = possibleTicks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [possibleTicks[i], possibleTicks[j]] = [possibleTicks[j], possibleTicks[i]];
      }
      return possibleTicks.slice(0, count).sort((a,b) => a-b);
    }

    // Draw Cartesian grid on canvas
    // Parameters:
    // canvas: canvas element
    // xScale, yScale: scale per interval
    // quadrants: 1 or 4
    // partialLabels: boolean - if true, label only some ticks with first tick blank
    // partialLabelIndicesX, partialLabelIndicesY: arrays of tick indices to label (for partialLabels)
    function drawGrid(canvas, xScale, yScale, quadrants, partialLabels = false, partialLabelIndicesX = [], partialLabelIndicesY = []) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      const margin = 40;
      const gridWidth = width - 2 * margin;
      const gridHeight = height - 2 * margin;

      const intervalsX = quadrants === 1 ? 10 : 5;
      const intervalsY = quadrants === 1 ? 10 : 5;

      const totalIntervalsX = intervalsX * (quadrants === 4 ? 2 : 1);
      const totalIntervalsY = intervalsY * (quadrants === 4 ? 2 : 1);

      const pxPerIntervalX = gridWidth / totalIntervalsX;
      const pxPerIntervalY = gridHeight / totalIntervalsY;

      const originX = quadrants === 1 ? margin : margin + intervalsX * pxPerIntervalX;
      const originY = quadrants === 1 ? height - margin : margin + intervalsY * pxPerIntervalY;

      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;

      // Vertical grid lines
      for (let i = 0; i <= totalIntervalsX; i++) {
        const x = margin + i * pxPerIntervalX;
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, height - margin);
        ctx.stroke();
      }

      // Horizontal grid lines
      for (let i = 0; i <= totalIntervalsY; i++) {
        const y = margin + i * pxPerIntervalY;
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(width - margin, y);
        ctx.stroke();
      }

      // Axes
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 2;

      // x-axis
      ctx.beginPath();
      ctx.moveTo(margin, originY);
      ctx.lineTo(width - margin, originY);
      ctx.stroke();

      // y-axis
      ctx.beginPath();
      ctx.moveTo(originX, margin);
      ctx.lineTo(originX, height - margin);
      ctx.stroke();

      ctx.fillStyle = 'black';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      // x-axis ticks and labels
      for (let i = 0; i <= totalIntervalsX; i++) {
        const x = margin + i * pxPerIntervalX;
        const tickHeight = 6;
        ctx.beginPath();
        ctx.moveTo(x, originY - tickHeight / 2);
        ctx.lineTo(x, originY + tickHeight / 2);
        ctx.stroke();

        // Label logic
        if (partialLabels) {
          // First tick label blank
          if (i === 0) continue;
          // Label only if i in partialLabelIndicesX
          if (!partialLabelIndicesX.includes(i)) continue;
        }

        let labelValue;
        if (quadrants === 1) {
          labelValue = formatScale(xScale * i);
        } else {
          labelValue = formatScale(xScale * (i - intervalsX));
        }
        ctx.fillText(labelValue, x, originY + tickHeight + 2);
      }

      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      // y-axis ticks and labels
      for (let i = 0; i <= totalIntervalsY; i++) {
        const y = margin + i * pxPerIntervalY;
        const tickWidth = 6;
        ctx.beginPath();
        ctx.moveTo(originX - tickWidth / 2, y);
        ctx.lineTo(originX + tickWidth / 2, y);
        ctx.stroke();

        if (partialLabels) {
          if (i === 0) continue;
          if (!partialLabelIndicesY.includes(i)) continue;
        }

        // y-axis labels go top to bottom
        let labelValue = formatScale(yScale * (intervalsY - i));
        ctx.fillText(labelValue, originX - tickWidth - 4, y);
      }
    }

    // Generate scale-identify question with optional partial labels and tick label indices
    function generateScaleQuestion(quadrants, partialLabels = false) {
      const xScale = scales[Math.floor(Math.random() * scales.length)];
      const yScale = scales[Math.floor(Math.random() * scales.length)];

      let xRange, yRange, quadrantDesc;
      if (quadrants === 1) {
        xRange = `0 to ${formatScale(xScale * 10)}`;
        yRange = `0 to ${formatScale(yScale * 10)}`;
        quadrantDesc = "Quadrant 1 only (positive x and y)";
      } else {
        xRange = `${formatScale(-xScale * 5)} to ${formatScale(xScale * 5)}`;
        yRange = `${formatScale(-yScale * 5)} to ${formatScale(yScale * 5)}`;
        quadrantDesc = "All four quadrants (negative and positive x and y)";
      }

      // For partial labels, generate random tick label indices for x and y axes
      let partialLabelIndicesX = [];
      let partialLabelIndicesY = [];
      if (partialLabels) {
        const intervalsX = quadrants === 1 ? 10 : 5;
        const intervalsY = quadrants === 1 ? 10 : 5;
        const totalTicksX = intervalsX * (quadrants === 4 ? 2 : 1);
        const totalTicksY = intervalsY * (quadrants === 4 ? 2 : 1);

        // Label between 3 and 6 ticks (excluding first tick)
        partialLabelIndicesX = randomTickLabels(totalTicksX, 3, 6);
        partialLabelIndicesY = randomTickLabels(totalTicksY, 3, 6);
      }

      return {
        type: "scale-identify",
        questionText: `Identify the scale on the x-axis and y-axis for the following Cartesian coordinate grid:<br>
        - ${quadrantDesc}<br>
        - x-axis range: ${xRange}<br>
        - y-axis range: ${yRange}<br>
        (Hint: The grid lines are evenly spaced according to the scale.)`,
        xScale,
        yScale,
        quadrants,
        partialLabels,
        partialLabelIndicesX,
        partialLabelIndicesY
      };
    }

    // Generate axis-values question, optionally with negatives
    function generateAxisValuesQuestion(includeNegatives = false) {
      const xScale = scales[Math.floor(Math.random() * scales.length)];
      const yScale = scales[Math.floor(Math.random() * scales.length)];
      const intervals = 5;

      let xValues, yValues, questionText;

      if (includeNegatives) {
        // Values from -intervals to +intervals
        xValues = Array.from({length: intervals * 2 + 1}, (_, i) => +(xScale * (i - intervals)).toFixed(5));
        yValues = Array.from({length: intervals * 2 + 1}, (_, i) => +(yScale * (i - intervals)).toFixed(5));
        questionText = `Write the values on the axes below given the following scales:<br>
          - The interval for the x-axis is ${formatScale(xScale)}<br>
          - The interval for the y-axis is ${formatScale(yScale)}<br>
          - There are ${intervals} intervals on each side of zero, so please provide the first ${intervals * 2 + 1} values starting from negative to positive.<br>
          Question: List the values on the x-axis and y-axis at each interval.`;
      } else {
        // Positive only as before
        xValues = Array.from({length: intervals + 1}, (_, i) => +(xScale * i).toFixed(5));
        yValues = Array.from({length: intervals + 1}, (_, i) => +(yScale * i).toFixed(5));
        questionText = `Write the values on the axes below given the following scales:<br>
          - The interval for the x-axis is ${formatScale(xScale)}<br>
          - The interval for the y-axis is ${formatScale(yScale)}<br>
          - There are ${intervals} intervals on each axis, so please provide the first ${intervals + 1} values starting at 0.<br>
          Question: List the values on the x-axis and y-axis at each interval.`;
      }

      return {
        type: "axis-values",
        questionText,
        xValues,
        yValues,
        includeNegatives
      };
    }

    // Build questions array with 10 questions total:
    // 5 scale-identify (2 with partial labels), 5 axis-values (2 with negatives)
    const questions = [];

    // Pick 2 unique indices from 0 to 4 for partial label scale-identify questions
    const partialLabelIndices = new Set();
    while (partialLabelIndices.size < 2) {
      partialLabelIndices.add(Math.floor(Math.random() * 5));
    }

    // 2 Quadrant 1 only scale-identify questions
    for (let i = 0; i < 2; i++) {
      questions.push(generateScaleQuestion(1, partialLabelIndices.has(i)));
    }
    // 3 all quadrants scale-identify questions
    for (let i = 2; i < 5; i++) {
      questions.push(generateScaleQuestion(4, partialLabelIndices.has(i)));
    }

    // 3 axis-values questions positive only
    for (let i = 0; i < 3; i++) {
      questions.push(generateAxisValuesQuestion(false));
    }
    // 2 axis-values questions with negatives
    for (let i = 0; i < 2; i++) {
      questions.push(generateAxisValuesQuestion(true));
    }

    // Shuffle all questions
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
    shuffle(questions);

    let currentQuestionIndex = 0;
    let score = 0;

    const quizContainer = document.getElementById("quiz-container");
    const nextBtn = document.getElementById("next-btn");
    const scoreDiv = document.getElementById("score");

    function showQuestion() {
      nextBtn.style.display = "none";
      const q = questions[currentQuestionIndex];
      quizContainer.innerHTML = `<div class="question">
        <p><strong>Question ${currentQuestionIndex + 1} of ${questions.length}:</strong></p>
        <p>${q.questionText}</p>
        <div id="graph-container"></div>
        <div id="answer-area"></div>
        <div id="feedback"></div>
      </div>`;

      const answerArea = document.getElementById("answer-area");
      const feedback = document.getElementById("feedback");
      const graphContainer = document.getElementById("graph-container");

      if (q.type === "scale-identify") {
        const canvas = document.createElement("canvas");
        canvas.width = 500;
        canvas.height = 500;
        graphContainer.appendChild(canvas);

        drawGrid(canvas, q.xScale, q.yScale, q.quadrants, q.partialLabels, q.partialLabelIndicesX, q.partialLabelIndicesY);

        answerArea.innerHTML = `
          <label for="x-scale-input">Scale on x-axis: </label>
          <input type="text" id="x-scale-input" autocomplete="off" />
          <br />
          <label for="y-scale-input">Scale on y-axis: </label>
          <input type="text" id="y-scale-input" autocomplete="off" />
          <br />
          <button id="submit-btn">Submit</button>
        `;

        document.getElementById("submit-btn").onclick = () => {
          const xInput = document.getElementById("x-scale-input").value.trim();
          const yInput = document.getElementById("y-scale-input").value.trim();
          if (xInput === "" || yInput === "") {
            feedback.textContent = "Please enter both scales.";
            return;
          }
          if (xInput === formatScale(q.xScale) && yInput === formatScale(q.yScale)) {
            feedback.textContent = "Correct!";
            score++;
          } else {
            feedback.innerHTML = `Incorrect. The correct scales are x-axis: <strong>${formatScale(q.xScale)}</strong>, y-axis: <strong>${formatScale(q.yScale)}</strong>.`;
          }
          nextBtn.style.display = "inline-block";
          disableInputs();
          updateScore();
        };
      } else if (q.type === "axis-values" && q.includeNegatives) {
        // Axis-values question with negatives: inputs on graph

        const canvas = document.createElement("canvas");
        canvas.width = 500;
        canvas.height = 500;
        graphContainer.appendChild(canvas);

        // Draw grid with all labels visible
        drawGrid(canvas, q.xValues[1] - q.xValues[0], q.yValues[1] - q.yValues[0], 4, false);

        // Create container for inputs positioned over canvas
        const inputContainer = document.createElement("div");
        inputContainer.className = "input-container";
        graphContainer.appendChild(inputContainer);

        const margin = 40;
        const intervalsX = q.xValues.length - 1;
        const intervalsY = q.yValues.length - 1;
        const gridWidth = canvas.width - 2 * margin;
        const gridHeight = canvas.height - 2 * margin;
        const pxPerIntervalX = gridWidth / intervalsX;
        const pxPerIntervalY = gridHeight / intervalsY;
        const originX = margin + intervalsX / 2 * pxPerIntervalX;
        const originY = margin + intervalsY / 2 * pxPerIntervalY;

        // Create x-axis inputs
        q.xValues.forEach((val, i) => {
          const input = document.createElement("input");
          input.type = "text";
          input.size = 4;
          input.className = "axis-input";
          input.style.left = (margin + i * pxPerIntervalX - 20) + "px";
          input.style.top = (originY + 10) + "px";
          input.id = `x-input-${i}`;
          inputContainer.appendChild(input);
        });

        // Create y-axis inputs
        q.yValues.forEach((val, i) => {
          const input = document.createElement("input");
          input.type = "text";
          input.size = 4;
          input.className = "axis-input";
          input.style.left = (originX - 50) + "px";
          input.style.top = (margin + i * pxPerIntervalY - 10) + "px";
          input.id = `y-input-${i}`;
          inputContainer.appendChild(input);
        });

        // Submit button below inputs
        answerArea.innerHTML = `<button id="submit-btn">Submit</button>`;
        answerArea.appendChild(inputContainer);

        document.getElementById("submit-btn").onclick = () => {
          const xUserValues = q.xValues.map((_, i) => {
            const val = document.getElementById(`x-input-${i}`).value.trim();
            return parseFloat(val);
          });
          const yUserValues = q.yValues.map((_, i) => {
            const val = document.getElementById(`y-input-${i}`).value.trim();
            return parseFloat(val);
          });

          const xCorrect = q.xValues.map(v => parseFloat(v.toFixed(5)));
          const yCorrect = q.yValues.map(v => parseFloat(v.toFixed(5)));

          if (arraysEqualNumbers(xUserValues, xCorrect) && arraysEqualNumbers(yUserValues, yCorrect)) {
            feedback.textContent = "Correct!";
            score++;
          } else {
            feedback.innerHTML = `Incorrect.<br>Correct x-axis values: <strong>${q.xValues.join(", ")}</strong><br>Correct y-axis values: <strong>${q.yValues.join(", ")}</strong>`;
          }
          nextBtn.style.display = "inline-block";
          disableInputs();
          updateScore();
        };

      } else if (q.type === "axis-values") {
        // Axis-values question positive only: text inputs below question
        answerArea.innerHTML = `
          <label for="x-values-input">x-axis values (comma separated): </label><br />
          <input type="text" id="x-values-input" autocomplete="off" style="width: 100%;" />
          <br />
          <label for="y-values-input">y-axis values (comma separated): </label><br />
          <input type="text" id="y-values-input" autocomplete="off" style="width: 100%;" />
          <br />
          <button id="submit-btn">Submit</button>
        `;

        document.getElementById("submit-btn").onclick = () => {
          const xInput = document.getElementById("x-values-input").value.trim();
          const yInput = document.getElementById("y-values-input").value.trim();
          if (xInput === "" || yInput === "") {
            feedback.textContent = "Please enter values for both axes.";
            return;
          }
          const xUserValues = xInput.split(",").map(s => parseFloat(s.trim()));
          const yUserValues = yInput.split(",").map(s => parseFloat(s.trim()));

          const xCorrect = q.xValues.map(v => parseFloat(v.toFixed(5)));
          const yCorrect = q.yValues.map(v => parseFloat(v.toFixed(5)));

          if (arraysEqualNumbers(xUserValues, xCorrect) && arraysEqualNumbers(yUserValues, yCorrect)) {
            feedback.textContent = "Correct!";
            score++;
          } else {
            feedback.innerHTML = `Incorrect.<br>Correct x-axis values: <strong>${q.xValues.join(", ")}</strong><br>Correct y-axis values: <strong>${q.yValues.join(", ")}</strong>`;
          }
          nextBtn.style.display = "inline-block";
          disableInputs();
          updateScore();
        };
      }
    }

    function disableInputs() {
      const inputs = quizContainer.querySelectorAll("input, button");
      inputs.forEach(el => {
        if (el.id !== "next-btn") el.disabled = true;
      });
    }

    function arraysEqualNumbers(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (isNaN(a[i]) || isNaN(b[i])) return false;
        if (Math.abs(a[i] - b[i]) > 0.0001) return false;
      }
      return true;
    }

    nextBtn.onclick = () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        quizContainer.innerHTML = `<h2>Quiz complete!</h2><p>Your score: ${score} / ${questions.length}</p>`;
        nextBtn.style.display = 'none';
      }
    };

    function updateScore() {
      scoreDiv.textContent = `Score: ${score} / ${questions.length}`;
    }

    showQuestion();
    updateScore();
  </script>
</body>
</html>
